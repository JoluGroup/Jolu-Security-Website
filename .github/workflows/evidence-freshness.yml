# Read-only monitoring of publication evidence (Milestone 5D.6, finding F5D5-02).
# It only READS the repository and prints findings. It does not deploy, publish, unpublish, push, comment, open
# issues or use any secret. See docs/seo/evidence-expiry-runbook.md.
#
# LIMITATION: GitHub runs `schedule` triggers only from the workflow file on the repository's DEFAULT branch. While this
# file exists only on a feature branch the schedule will not fire; it can still be run by hand (workflow_dispatch) once
# on the default branch, or the command below can be run locally. Scheduled runs are also paused by GitHub after 60 days
# without repository activity in public repositories, and are best-effort (they can be delayed or skipped).
name: Evidence freshness

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Evidence freshness check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check evidence freshness
        run: node --import ./tests/register.mjs scripts/check-evidence-freshness.mjs
